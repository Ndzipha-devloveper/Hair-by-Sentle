<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | HairBySentle</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#24151d',berry:'#5b1735',pink:'#d94f82',rose:'#f7dce5',blush:'#fff8fa',champagne:'#c9a45c'},fontFamily:{sans:['DM Sans','sans-serif'],display:['Playfair Display','serif']}}}}</script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="styles.css"></head><body><div id="siteHeader"></div><main class="max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-16"><div id="product"></div></main><div id="siteFooter"></div><div id="cartMount"></div><script src="common.js"></script><script src="components.js"></script><script>document.getElementById('siteHeader').innerHTML=siteHeader('Shop');document.getElementById('siteFooter').innerHTML=siteFooter();const id=Number(new URLSearchParams(location.search).get('id'))||1,p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];document.getElementById('product').innerHTML=`<a href="shop.html" class="inline-flex items-center gap-2 text-xs font-bold text-berry"><i data-lucide="arrow-left" class="size-4"></i> Back to shop</a><div class="mt-7 grid lg:grid-cols-2 gap-8 lg:gap-12 items-start"><div class="img-hover rounded-[34px] overflow-hidden bg-rose aspect-[.9]"><img src="${p.img}" class="w-full h-full object-cover" alt="${p.name}"></div><div class="lg:pt-5"><span class="text-xs uppercase tracking-[.18em] font-bold text-pink">${p.tag}</span><h1 class="display mt-2 text-4xl sm:text-5xl">${p.name}</h1><div class="mt-3 flex items-center gap-3"><span class="text-pink text-sm">★★★★★</span><span class="text-xs text-ink/40">4.9 · customer favourite</span></div><p class="mt-5 text-3xl font-bold text-pink">${money(p.price)}</p><p class="mt-4 text-sm leading-7 text-ink/55">A beautiful HairBySentle selection designed for a polished, confident finish. Choose the option that matches your desired look.</p><div class="mt-7"><p class="text-sm font-bold">Length</p><div class="mt-2 flex flex-wrap gap-2">${['16 inch','18 inch','20 inch','22 inch','24 inch'].map((x,i)=>`<button class="length rounded-full border ${i===1?'border-pink bg-blush text-pink':'border-rose'} px-4 py-2 text-xs font-bold">${x}</button>`).join('')}</div></div><div class="mt-6"><p class="text-sm font-bold">Quantity</p><div class="mt-2 flex items-center gap-3"><button id="minus" class="size-10 rounded-full bg-blush grid place-items-center"><i data-lucide="minus"></i></button><span id="qty" class="font-bold">1</span><button id="plus" class="size-10 rounded-full bg-blush grid place-items-center"><i data-lucide="plus"></i></button></div></div><button id="add" class="btn mt-7 w-full rounded-full bg-berry py-4 text-sm font-bold text-white">Add to bag <i data-lucide="shopping-bag" class="inline size-4 ml-1"></i></button><button id="buyNow" class="btn mt-3 w-full rounded-full border border-berry/15 py-4 text-center text-sm font-bold">Buy now <i data-lucide="arrow-right" class="inline size-4 ml-1"></i></button><div class="mt-7 grid sm:grid-cols-3 gap-3"><div class="rounded-2xl bg-blush p-4"><i data-lucide="truck" class="size-5 text-pink"></i><p class="mt-2 text-xs font-bold">Delivery</p><p class="mt-1 text-[10px] text-ink/45">Nationwide</p></div><div class="rounded-2xl bg-blush p-4"><i data-lucide="shield-check" class="size-5 text-pink"></i><p class="mt-2 text-xs font-bold">Secure</p><p class="mt-1 text-[10px] text-ink/45">Protected checkout</p></div><div class="rounded-2xl bg-blush p-4"><i data-lucide="heart" class="size-5 text-pink"></i><p class="mt-2 text-xs font-bold">Loved</p><p class="mt-1 text-[10px] text-ink/45">Customer favourite</p></div></div></div></div>`;let q=1;document.getElementById('plus').onclick=()=>{q++;document.getElementById('qty').textContent=q};document.getElementById('minus').onclick=()=>{q=Math.max(1,q-1);document.getElementById('qty').textContent=q};document.getElementById('add').onclick=e=>{addToCart(p.id,e.currentTarget,q);};document.getElementById('buyNow').onclick=()=>{addToCart(p.id,document.getElementById('buyNow'),q);setTimeout(()=>location.href=checkoutUrl(),950)};document.querySelectorAll('.length').forEach(b=>b.onclick=()=>{document.querySelectorAll('.length').forEach(x=>x.className=x.className.replace('border-pink bg-blush text-pink','border-rose'));b.className=b.className.replace('border-rose','border-pink bg-blush text-pink')});lucide.createIcons()</script></body></html>
