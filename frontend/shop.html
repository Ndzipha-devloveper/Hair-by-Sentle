<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | HairBySentle</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#24151d',berry:'#5b1735',pink:'#d94f82',rose:'#f7dce5',blush:'#fff8fa',champagne:'#c9a45c'},fontFamily:{sans:['DM Sans','sans-serif'],display:['Playfair Display','serif']}}}}</script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="styles.css"></head><body><div id="siteHeader"></div><main><section class="bg-blush"><div class="max-w-7xl mx-auto px-4 sm:px-6 py-14 sm:py-20 text-center"><p class="text-xs uppercase tracking-[.2em] font-bold text-pink">The collection</p><h1 class="display mt-3 text-4xl sm:text-6xl font-semibold">Shop your crown</h1><p class="mt-4 max-w-xl mx-auto text-sm leading-6 text-ink/55">Explore premium weaves, bundles, wigs and care essentials selected for every kind of look.</p></div></section><section class="max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-14"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"><div class="flex flex-wrap gap-2"><button class="filter active rounded-full bg-berry px-4 py-2 text-xs font-bold text-white" data-filter="all">All</button><button class="filter rounded-full bg-blush px-4 py-2 text-xs font-bold" data-filter="weave">Weaves</button><button class="filter rounded-full bg-blush px-4 py-2 text-xs font-bold" data-filter="bundle">Bundles</button><button class="filter rounded-full bg-blush px-4 py-2 text-xs font-bold" data-filter="care">Care</button></div><div class="flex items-center gap-2 rounded-full border border-rose px-4 py-2 text-xs"><i data-lucide="sliders-horizontal" class="size-4"></i><select id="sort" class="bg-transparent outline-none"><option>Featured</option><option>Price: Low to high</option><option>Price: High to low</option></select></div></div><div id="products" class="mt-8 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"></div></section></main><div id="siteFooter"></div><div id="cartMount"></div><script src="common.js"></script><script src="components.js"></script><script>document.getElementById('siteHeader').innerHTML=siteHeader('Shop');document.getElementById('siteFooter').innerHTML=siteFooter();function draw(f='all'){mountProducts('products',f);document.querySelectorAll('.filter').forEach(b=>{b.classList.toggle('bg-berry',b.dataset.filter===f);b.classList.toggle('text-white',b.dataset.filter===f);b.classList.toggle('bg-blush',b.dataset.filter!==f)})}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>draw(b.dataset.filter));document.getElementById('sort').onchange=e=>{let l=e.target.value==='Price: Low to high'?[...PRODUCTS].sort((a,b)=>a.price-b.price):e.target.value==='Price: High to low'?[...PRODUCTS].sort((a,b)=>b.price-a.price):PRODUCTS;document.getElementById('products').innerHTML=l.map(productCard).join('');lucide.createIcons()};draw();</script></body></html>
